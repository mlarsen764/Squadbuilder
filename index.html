<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Squadbuilder Adventure - Combat Prototype</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header class="topbar">
    <div><h1>Squadbuilder Adventure</h1><p id="phaseLabel">Round 1 - Player Phase</p></div>
    <div class="top-actions"><button id="endPhaseBtn">End Player Phase</button><button id="restartBtn" class="secondary">Restart</button></div>
  </header>

  <section class="target-strip"><span id="targetPrompt">Choose a card or Basic Action.</span><button id="cancelTargetBtn" class="secondary small" hidden>Cancel</button></section>

  <section class="panel">
    <div class="section-head"><h2>Enemy Lane</h2><span>Choose an action first, then select a highlighted target.</span></div>
    <div id="enemyLane" class="card-grid enemies"></div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>Your Squad</h2><span>Frontline protects the Backline from melee enemies.</span></div>
    <div class="formation">
      <div class="formation-row"><h3>Frontline</h3><div id="frontline" class="card-grid heroes"></div></div>
      <div class="formation-row"><h3>Backline</h3><div id="backline" class="card-grid heroes"></div></div>
    </div>
  </section>

  <section class="panel">
    <div class="section-head"><h2>Hand <small id="handCount">0/4</small></h2><span><b id="deckCount">0</b> deck / <b id="discardCount">0</b> discard · Limit 4</span></div>
    <div id="hand" class="hand"></div>
  </section>

  <section class="panel compact">
    <h2>Combat Log</h2><div id="log" class="log" aria-live="polite"></div>
  </section>
</main>
<script src="data/gameData.js"></script>
<script src="src/game.js"></script>
</body>
</html>
